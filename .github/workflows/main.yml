name: Build Kuzhali Tailoring APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Check out repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Setup Java JDK for Android Gradle build
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install dependencies and compile React Vite app
      - name: Install Dependencies and Build Web App
        run: |
          npm ci || npm install
          npm run build

      # 6. Initialize Capacitor Android project
      - name: Setup Capacitor Android
        run: |
          npx cap init "குழலி தையலகம்" "com.kuzhali.tailoring" --web-dir dist
          npx cap add android
          npx cap sync android

      # 7. Grant execute permissions to Gradle wrapper
      - name: Grant Execute Permission to Gradlew
        run: |
          cd android
          chmod +x gradlew

      # 8. Compile the standalone Android APK
      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      # 9. Upload the generated APK as a downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuzhali-Tailoring-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          
