name: Build Kuzhali Tailoring APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Install Dependencies and Build Web App
      - name: Install Dependencies and Build Web App
        run: |
          npm install
          npm run build

      # 5. Initialize Capacitor Android Project
      - name: Setup Capacitor Android
        run: |
          npx cap init "குழலி தையலகம்" "com.kuzhali.tailoring" --web-dir dist
          npx cap add android
          npx cap sync android

      # 6. Build Android Debug APK using built-in Android SDK
      - name: Build Android Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # 7. Upload the generated APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuzhali-Tailoring-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          
