name: Build Kuzhali Tailoring APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js (Removed lock-file cache to prevent error)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Setup Java 17 for Android
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install dependencies and build web
      - name: Install Dependencies and Build Web App
        run: |
          npm install
          npm run build

      # 6. Setup Capacitor Android
      - name: Setup Capacitor Android
        run: |
          npx cap init "குழலி தையலகம்" "com.kuzhali.tailoring" --web-dir dist
          npx cap add android
          npx cap sync android

      # 7. Grant execution permission to Gradle
      - name: Grant Execute Permission to Gradlew
        run: |
          cd android
          chmod +x gradlew

      # 8. Build Debug APK
      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      # 9. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuzhali-Tailoring-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
