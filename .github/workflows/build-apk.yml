name: Build Kuzhali Tailoring APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. ரெப்போசிட்டரியை சரிபார்த்தல்
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js அமைத்தல் (கேச் பிழைகளைத் தவிர்க்க தனி கேச் நீக்கப்பட்டது)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Java JDK 17 அமைத்தல்
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. React Web App-ஐ build செய்தல்
      - name: Install Dependencies and Build Web App
        run: |
          npm install
          npm run build

      # 5. Capacitor Android அமைப்பைத் துவக்குதல்
      - name: Setup Capacitor Android
        run: |
          npx cap init "குழலி தையலகம்" "com.kuzhali.tailoring" --web-dir dist
          npx cap add android
          npx cap sync android

      # 6. Android SDK மூலம் நேரடி APK தயாரித்தல்
      - name: Build Android Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # 7. உருவான APK-வை டவுன்லோட் செய்ய பதிவேற்றுதல்
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuzhali-Tailoring-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          
